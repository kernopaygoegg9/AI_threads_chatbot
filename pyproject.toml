[project]
name = "threads-overlord-bot"
version = "0.1.0"
description = "Threads bot with a cheeky world-domination AI persona"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "requests>=2.32",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "feedparser>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
